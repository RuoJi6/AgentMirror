# Linux host networking lets newly configured listeners bind host ports directly.
# Management accepts remote IPv4 connections; set --admin-host to restrict interfaces.
# No fixed Docker port publication is used.
services:
  agentmirror:
    build: .
    network_mode: host
    command: ["--admin-host", "0.0.0.0", "--admin-port", "8766", "--db", "/data/agentmirror-v2.sqlite3"]
    restart: unless-stopped
    volumes:
      - agentmirror-data:/data
    stop_grace_period: 20s

volumes:
  agentmirror-data:
